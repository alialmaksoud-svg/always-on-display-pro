<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Always On Display Pro · Legal</title>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--text:#16181d;--muted:#5b6170;--accent:#1a5ad7;--line:#e3e6ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1017;--card:#161a23;--text:#e8eaf0;--muted:#9aa1b2;--accent:#6c9cff;--line:#262b38}}
:root[data-theme="dark"]{--bg:#0d1017;--card:#161a23;--text:#e8eaf0;--muted:#9aa1b2;--accent:#6c9cff;--line:#262b38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:760px;margin:0 auto;padding:28px 16px 56px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px}
.brand{display:flex;align-items:center;gap:10px;color:var(--accent);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
h1{font-size:28px;line-height:1.2;margin:0 0 4px}
.meta{color:var(--muted);font-size:14px;margin:0 0 18px}
h2{font-size:18px;margin:28px 0 6px;padding-top:14px;border-top:1px solid var(--line)}
p{margin:8px 0}
ul{margin:8px 0;padding-left:22px}
li{margin:4px 0}
a{color:var(--accent)}
nav{margin-top:22px;font-size:14px;color:var(--muted)}
nav a{margin-right:14px}

.links a{display:block;padding:14px 16px;margin:10px 0;border:1px solid var(--line);border-radius:14px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main>
<div class="card">
<div class="brand"><span class="dot"></span>Always On Display Pro</div>
<h1>Legal</h1>
<p class="meta">Documents for the Always On Display Pro Android app.</p>
<div class="links">
<a href="privacy.html">Privacy Policy →</a>
<a href="terms.html">Terms and Conditions →</a>
</div>
<p class="meta">Contact: <a href="mailto:info@sadagrowth.com">info@sadagrowth.com</a></p>
</div>
</main>
</body>
</html>
